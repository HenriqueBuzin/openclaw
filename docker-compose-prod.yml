name: openclaw

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-labels: &default-labels
  infra.project: openclaw
  infra.environment: production
  infra.version: ${IMAGE_TAG:-local}

services:
  model:
    image: ollama/ollama:0.32.0
    labels: *default-labels
    restart: unless-stopped
    gpus: all
    environment:
      TZ: America/Sao_Paulo
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - type: bind
        source: ${OLLAMA_DATA_ROOT:-/root/projects/volumes/openclaw/ollama}
        target: /root/.ollama
    expose:
      - "11434"
    networks:
      internal:
        aliases:
          - ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  model-init:
    image: openclaw/model-init:${IMAGE_TAG:-local}
    labels: *default-labels
    build:
      context: .
      dockerfile: Dockerfile.model-init
    restart: "no"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    depends_on:
      model:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  config-init:
    image: openclaw/config-init:${IMAGE_TAG:-local}
    labels: *default-labels
    build:
      context: .
      dockerfile: Dockerfile.config-init
    restart: "no"
    user: "0:0"
    volumes:
      - type: bind
        source: ${OPENCLAW_DATA_ROOT:-/root/projects/volumes/openclaw/openclaw}
        target: /state
      - type: bind
        source: ./openclaw.json
        target: /config/openclaw.json
        read_only: true
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    image: openclaw/backend:${IMAGE_TAG:-local}
    labels: *default-labels
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ghcr.io/openclaw/openclaw:2026.7.1
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        BUILD_NUMBER: ${BUILD_NUMBER:-local}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Defina OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - type: bind
        source: ${OPENCLAW_DATA_ROOT:-/root/projects/volumes/openclaw/openclaw}
        target: /home/node/.openclaw
    expose:
      - "18789"
    networks:
      - internal
    depends_on:
      model-init:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    image: caddy:2.11.4-alpine
    labels: *default-labels
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "80"
    networks:
      internal:
      proxy-network:
        aliases:
          - openclaw
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  internal:
    name: openclaw-internal
  proxy-network:
    external: true
